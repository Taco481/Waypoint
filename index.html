<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint Dental Expertise | Onafhankelijk tandheelkundig advies</title>
<meta name="description" content="Waypoint Dental Expertise biedt onafhankelijk tandheelkundig advies en expertise voor advocatenkantoren, verzekeringsmaatschappijen en particulieren. Helder onderbouwd.">
<link rel="icon" href="assets/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header" id="header">
  <div class="container header-inner">
    <a href="#top" class="brand" aria-label="Waypoint Dental Expertise - home">
      <img src="assets/logo.jpeg" alt="Waypoint Dental Expertise" class="brand-logo">
      <span class="brand-text">
        <span class="brand-name" id="brandName">Waypoint</span>
        <span class="brand-sub" id="brandSub">Dental Expertise</span>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="Hoofdnavigatie"></nav>

    <button class="nav-toggle" id="navToggle" aria-label="Menu openen" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="container hero-inner">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroLead"></p>
      <div class="hero-actions">
        <a href="#diensten" class="btn btn-primary" id="heroCtaPrimary"></a>
        <a href="#contact" class="btn btn-ghost" id="heroCtaSecondary"></a>
      </div>
      <ul class="hero-badges" id="heroBadges"></ul>
    </div>
  </section>

  <section class="intro section">
    <div class="container intro-grid">
      <div class="intro-text">
        <p class="eyebrow" id="introEyebrow"></p>
        <h2 id="introTitle"></h2>
        <p id="introP1"></p>
        <p id="introP2"></p>
      </div>
      <div class="intro-card">
        <p class="intro-card-quote" id="introCardQuote"></p>
        <p class="intro-card-sub" id="introCardSub"></p>
      </div>
    </div>
  </section>

  <section id="diensten" class="section section-alt">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow" id="dienstenEyebrow"></p>
        <h2 id="dienstenTitle"></h2>
      </div>
      <div class="cards" id="dienstenCards"></div>
    </div>
  </section>

  <section id="werkwijze" class="section">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow" id="werkwijzeEyebrow"></p>
        <h2 id="werkwijzeTitle"></h2>
      </div>
      <ol class="steps" id="werkwijzeSteps"></ol>
    </div>
  </section>

  <section id="waarom" class="section section-alt">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow" id="waaromEyebrow"></p>
        <h2 id="waaromTitle"></h2>
      </div>
      <div class="features" id="waaromFeatures"></div>
    </div>
  </section>

  <section id="over" class="section over">
    <div class="container over-grid">
      <div class="over-text">
        <p class="eyebrow" id="overEyebrow"></p>
        <h2 id="overTitle"></h2>
        <p id="overP1"></p>
        <p id="overP2"></p>
      </div>
      <figure class="over-media">
        <img class="over-image" src="assets/langeveld.jpeg" alt="M.Sc. D.J. Langeveld" loading="lazy">
        <figcaption class="over-caption" id="overCaption"></figcaption>
      </figure>
    </div>
  </section>

  <section id="contact" class="section cta">
    <div class="container cta-inner">
      <h2 id="ctaTitle"></h2>
      <p id="ctaText"></p>
      <div class="cta-actions">
        <a href="#" class="btn btn-primary" id="ctaEmail"></a>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <img src="assets/logo.jpeg" alt="Waypoint Dental Expertise" class="footer-logo">
      <span id="footerBrandName"></span>
    </div>
    <nav class="footer-nav" id="footerNav" aria-label="Voetnavigatie"></nav>
    <p class="footer-copy">&copy; <span id="year"></span> <span id="footerCopy"></span></p>
  </div>
</footer>

<script src="Admin%20Website.js"></script>
<script src="script.js"></script>
</body>
</html>
